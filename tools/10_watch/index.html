<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=450,height=450,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>Crypto Watch</title>

<style>
* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    background: #000;
    color: #fff;
    font-family: Arial, sans-serif;
    overflow: hidden;
}

body {
    display: flex;
    justify-content: center;
    align-items: center;
}

#app {
    position: relative;
    width: 450px;
    height: 450px;
    max-width: 100vw;
    max-height: 100vh;
    overflow: hidden;
}

/* ================= SETUP ================= */

#setup {
    width: 100%;
    height: 100%;
    padding: 12px 28px;
    display: flex;
    flex-direction: column;
    justify-content: center;
}

.logo {
    text-align: center;
    font-size: 17px;
    font-weight: 900;
    letter-spacing: 2px;
    margin-bottom: 14px;
}

.step {
    display: none;
}

.step.active {
    display: block;
}

.step-title {
    text-align: center;
    color: #777;
    font-size: 12px;
    margin-bottom: 7px;
}

input {
    width: 100%;
    height: 45px;
    border: 1px solid #292929;
    border-radius: 12px;
    outline: none;
    background: #101010;
    color: white;
    text-align: center;
    font-size: 19px;
    font-weight: 800;
}

input:focus {
    border-color: #777;
}

button {
    width: 100%;
    height: 40px;
    margin-top: 7px;
    border: 0;
    border-radius: 11px;
    background: #fff;
    color: #000;
    font-size: 13px;
    font-weight: 900;
}

button:active {
    transform: scale(.96);
}

.direction {
    display: flex;
    gap: 7px;
}

.direction button {
    flex: 1;
}

.long-btn {
    background: #16c784;
}

.short-btn {
    background: #ea3943;
}

.progress {
    position: absolute;
    left: 25px;
    right: 25px;
    bottom: 8px;
    height: 2px;
    background: #202020;
}

.progress-bar {
    width: 20%;
    height: 100%;
    background: #fff;
    transition: width .2s;
}


/* ================= TERMINAL ================= */

#terminal {
    display: none;
    width: 100%;
    height: 100%;
    padding: 10px 24px;
}

.header {
    height: 25px;
    display: flex;
    align-items: center;
    justify-content: space-between;
}

.pair {
    font-size: 14px;
    font-weight: 900;
}

.status {
    font-size: 9px;
    color: #555;
}


/* PRICE */

.price-box {
    text-align: center;
    margin-top: 5px;
}

.current-price {
    font-size: 31px;
    line-height: 1;
    font-weight: 900;
    letter-spacing: -1px;
}

.price-label {
    color: #555;
    font-size: 8px;
    margin-top: 3px;
}


/* PNL */

.pnl-box {
    margin-top: 9px;
    padding: 9px 5px;
    border-radius: 16px;
    background: #0c0c0c;
    text-align: center;
}

.pnl {
    font-size: 37px;
    line-height: 1;
    font-weight: 900;
}

.pnl-percent {
    margin-top: 3px;
    font-size: 14px;
    font-weight: 800;
}

.green {
    color: #16c784;
}

.red {
    color: #ea3943;
}

.neutral {
    color: #fff;
}


/* INFO */

.info {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 5px;
    margin-top: 7px;
}

.info-item {
    background: #0c0c0c;
    border-radius: 9px;
    padding: 5px 2px;
    text-align: center;
}

.info-label {
    color: #555;
    font-size: 7px;
    margin-bottom: 2px;
}

.info-value {
    font-size: 11px;
    font-weight: 800;
    white-space: nowrap;
}


/* FOOTER */

.footer {
    position: absolute;
    left: 24px;
    right: 24px;
    bottom: 10px;
    display: flex;
    align-items: center;
    justify-content: space-between;
}

.direction-label {
    font-size: 11px;
    font-weight: 900;
}

.reset {
    width: auto;
    height: 25px;
    margin: 0;
    padding: 0 9px;
    border-radius: 8px;
    background: #181818;
    color: #777;
    font-size: 9px;
}


/* ================= SIGNAL ================= */

#signal {
    position: absolute;
    inset: 0;
    display: none;
    align-items: center;
    justify-content: center;
    background: rgba(0,0,0,.96);
    z-index: 100;
}

.signal-inner {
    text-align: center;
}

.signal-title {
    color: #555;
    font-size: 10px;
    margin-bottom: 4px;
}

.signal-value {
    font-size: 57px;
    font-weight: 900;
    line-height: 1;
}

.signal-text {
    font-size: 11px;
    margin-top: 5px;
    font-weight: 800;
}

.signal-close {
    width: 90px;
    height: 34px;
    margin-top: 12px;
    font-size: 11px;
}


/* ================= SMALL SCREEN ================= */

@media (max-width: 350px) {

    #setup {
        padding-left: 20px;
        padding-right: 20px;
    }

    #terminal {
        padding-left: 17px;
        padding-right: 17px;
    }

    .current-price {
        font-size: 27px;
    }

    .pnl {
        font-size: 32px;
    }

    .info-value {
        font-size: 9px;
    }

    .footer {
        left: 17px;
        right: 17px;
    }
}
</style>
</head>


<body>

<div id="app">

<!-- ================= SETUP ================= -->

<div id="setup">

    <div class="logo">
        CRYPTO WATCH
    </div>


    <!-- 1 -->

    <div class="step active" id="step1">

        <div class="step-title">
            ПАРА
        </div>

        <input
            id="pairInput"
            type="text"
            placeholder="BTCUSDT"
            autocomplete="off"
            autocapitalize="characters"
            spellcheck="false">

        <button onclick="nextPair()">
            ВВОД
        </button>

    </div>


    <!-- 2 -->

    <div class="step" id="step2">

        <div class="step-title">
            МАРЖА USDT
        </div>

        <input
            id="marginInput"
            type="number"
            inputmode="decimal"
            placeholder="100">

        <button onclick="nextMargin()">
            ВВОД
        </button>

    </div>


    <!-- 3 -->

    <div class="step" id="step3">

        <div class="step-title">
            ПЛЕЧО
        </div>

        <input
            id="leverageInput"
            type="number"
            inputmode="decimal"
            placeholder="10">

        <button onclick="nextLeverage()">
            ВВОД
        </button>

    </div>


    <!-- 4 -->

    <div class="step" id="step4">

        <div class="step-title">
            ЦЕНА ВХОДА
        </div>

        <input
            id="entryInput"
            type="number"
            inputmode="decimal"
            placeholder="100000">

        <button onclick="nextEntry()">
            ВВОД
        </button>

    </div>


    <!-- 5 -->

    <div class="step" id="step5">

        <div class="step-title">
            НАПРАВЛЕНИЕ
        </div>

        <div class="direction">

            <button
                class="long-btn"
                onclick="startTerminal('LONG')">
                LONG
            </button>

            <button
                class="short-btn"
                onclick="startTerminal('SHORT')">
                SHORT
            </button>

        </div>

    </div>


    <div class="progress">
        <div
            class="progress-bar"
            id="progressBar">
        </div>
    </div>

</div>


<!-- ================= TERMINAL ================= -->

<div id="terminal">

    <div class="header">

        <div
            class="pair"
            id="pairDisplay">
            BTC-USDT-SWAP
        </div>

        <div
            class="status"
            id="status">
            CONNECTING
        </div>

    </div>


    <div class="price-box">

        <div
            class="current-price"
            id="currentPrice">
            ---
        </div>

        <div class="price-label">
            OKX PRICE
        </div>

    </div>


    <div class="pnl-box">

        <div
            class="pnl neutral"
            id="pnl">
            0.00
        </div>

        <div
            class="pnl-percent neutral"
            id="pnlPercent">
            0.00%
        </div>

    </div>


    <div class="info">

        <div class="info-item">

            <div class="info-label">
                MARGIN
            </div>

            <div
                class="info-value"
                id="marginDisplay">
                ---
            </div>

        </div>


        <div class="info-item">

            <div class="info-label">
                LEV
            </div>

            <div
                class="info-value"
                id="leverageDisplay">
                ---
            </div>

        </div>


        <div class="info-item">

            <div class="info-label">
                ENTRY
            </div>

            <div
                class="info-value"
                id="entryDisplay">
                ---
            </div>

        </div>


        <div class="info-item">

            <div class="info-label">
                POS
            </div>

            <div
                class="info-value"
                id="positionDisplay">
                ---
            </div>

        </div>

    </div>


    <div class="footer">

        <div
            id="directionDisplay"
            class="direction-label">
            LONG
        </div>

        <button
            class="reset"
            onclick="resetTerminal()">
            RESET
        </button>

    </div>

</div>


<!-- ================= SIGNAL ================= -->

<div id="signal">

    <div class="signal-inner">

        <div class="signal-title">
            SIGNAL
        </div>

        <div
            id="signalValue"
            class="signal-value">
            +5%
        </div>

        <div
            id="signalText"
            class="signal-text">
            PROFIT
        </div>

        <button
            class="signal-close"
            onclick="closeSignal()">
            OK
        </button>

    </div>

</div>

</div>


<script>

let pair = "";
let margin = 0;
let leverage = 0;
let entryPrice = 0;
let direction = "";

let ws = null;

let lastSignalLevel = null;


/* ================= HELPERS ================= */

function showStep(number) {

    document.querySelectorAll(".step")
        .forEach(el => {
            el.classList.remove("active");
        });

    document
        .getElementById("step" + number)
        .classList.add("active");

    document
        .getElementById("progressBar")
        .style.width =
        ((number / 5) * 100) + "%";
}


function normalizePair(value) {

    value = value
        .toUpperCase()
        .replace(/[^A-Z0-9]/g, "");

    if (value.endsWith("USDT")) {
        return value.replace("USDT", "") +
               "-USDT-SWAP";
    }

    return value + "-USDT-SWAP";
}


function formatPrice(price) {

    if (!Number.isFinite(price)) {
        return "---";
    }

    if (price >= 1000) {
        return price.toLocaleString("en-US", {
            minimumFractionDigits: 2,
            maximumFractionDigits: 2
        });
    }

    if (price >= 1) {
        return price.toFixed(3);
    }

    return price.toFixed(6);
}


function formatNumber(number) {

    return number.toLocaleString("en-US", {
        minimumFractionDigits: 2,
        maximumFractionDigits: 2
    });
}


function focusInput(id) {

    setTimeout(() => {

        const input =
            document.getElementById(id);

        if (input) {
            input.focus();
        }

    }, 100);
}


/* ================= SETUP ================= */

function nextPair() {

    const value =
        document.getElementById("pairInput")
        .value
        .trim();

    if (!value) return;

    pair = normalizePair(value);

    showStep(2);

    focusInput("marginInput");
}


function nextMargin() {

    const value =
        parseFloat(
            document.getElementById("marginInput").value
        );

    if (!Number.isFinite(value) || value <= 0) {
        return;
    }

    margin = value;

    showStep(3);

    focusInput("leverageInput");
}


function nextLeverage() {

    const value =
        parseFloat(
            document.getElementById("leverageInput").value
        );

    if (!Number.isFinite(value) || value <= 0) {
        return;
    }

    leverage = value;

    showStep(4);

    focusInput("entryInput");
}


function nextEntry() {

    const value =
        parseFloat(
            document.getElementById("entryInput").value
        );

    if (!Number.isFinite(value) || value <= 0) {
        return;
    }

    entryPrice = value;

    showStep(5);
}


/* ================= TERMINAL ================= */

function startTerminal(side) {

    direction = side;

    document.getElementById("setup")
        .style.display = "none";

    document.getElementById("terminal")
        .style.display = "block";

    document.getElementById("pairDisplay")
        .textContent = pair;

    document.getElementById("marginDisplay")
        .textContent =
        "$" + formatNumber(margin);

    document.getElementById("leverageDisplay")
        .textContent =
        leverage + "x";

    document.getElementById("entryDisplay")
        .textContent =
        formatPrice(entryPrice);

    document.getElementById("positionDisplay")
        .textContent =
        "$" + formatNumber(margin * leverage);

    const directionElement =
        document.getElementById("directionDisplay");

    directionElement.textContent =
        direction;

    directionElement.className =
        "direction-label " +
        (direction === "LONG"
            ? "green"
            : "red");

    connectOKX();
}


/* ================= OKX ================= */

function connectOKX() {

    if (ws) {

        try {
            ws.close();
        } catch (e) {}

    }

    document.getElementById("status")
        .textContent = "CONNECT";

    ws = new WebSocket(
        "wss://ws.okx.com:8443/ws/v5/public"
    );


    ws.onopen = function() {

        document.getElementById("status")
            .textContent = "LIVE";

        ws.send(
            JSON.stringify({
                op: "subscribe",
                args: [{
                    channel: "tickers",
                    instId: pair
                }]
            })
        );

    };


    ws.onmessage = function(event) {

        try {

            const data =
                JSON.parse(event.data);

            if (
                data.arg &&
                data.arg.channel === "tickers" &&
                data.data &&
                data.data[0]
            ) {

                const price =
                    parseFloat(
                        data.data[0].last
                    );

                if (Number.isFinite(price)) {
                    updatePrice(price);
                }

            }

        } catch (e) {}

    };


    ws.onerror = function() {

        document.getElementById("status")
            .textContent = "ERROR";

    };


    ws.onclose = function() {

        document.getElementById("status")
            .textContent = "RECONNECT";

        setTimeout(() => {

            if (
                document.getElementById("terminal")
                .style.display !== "none"
            ) {
                connectOKX();
            }

        }, 3000);

    };
}


/* ================= PNL ================= */

function updatePrice(currentPrice) {

    document.getElementById("currentPrice")
        .textContent =
        formatPrice(currentPrice);


    const positionSize =
        margin * leverage;


    let priceChange;

    if (direction === "LONG") {

        priceChange =
            (currentPrice - entryPrice)
            / entryPrice;

    } else {

        priceChange =
            (entryPrice - currentPrice)
            / entryPrice;
    }


    const pnl =
        positionSize * priceChange;


    const pnlPercent =
        (pnl / margin) * 100;


    renderPNL(
        pnl,
        pnlPercent
    );

    checkSignal(pnl);
}


/* ================= DISPLAY PNL ================= */

function renderPNL(pnl, percent) {

    const pnlElement =
        document.getElementById("pnl");

    const percentElement =
        document.getElementById("pnlPercent");


    pnlElement.textContent =
        (pnl > 0 ? "+" : "") +
        formatNumber(pnl) +
        " USDT";


    percentElement.textContent =
        (percent > 0 ? "+" : "") +
        percent.toFixed(2) +
        "%";


    pnlElement.className = "pnl";
    percentElement.className = "pnl-percent";


    if (pnl > 0) {

        pnlElement.classList.add("green");
        percentElement.classList.add("green");

    } else if (pnl < 0) {

        pnlElement.classList.add("red");
        percentElement.classList.add("red");

    } else {

        pnlElement.classList.add("neutral");
        percentElement.classList.add("neutral");
    }
}


/* ================= SIGNAL LEVEL ================= */

function getSignalLevel(pnl) {

    // Сигнал каждые 5 USDT
    // +5, +10, +15...
    // -5, -10, -15...

    if (Math.abs(pnl) < 5) {
        return null;
    }

    const level =
        Math.floor(Math.abs(pnl) / 5) * 5;

    return pnl > 0 ? level : -level;
}


function checkSignal(pnl) {

    const level = getSignalLevel(pnl);

    if (level === null) {
        return;
    }

    if (level !== lastSignalLevel) {

        lastSignalLevel = level;

        showSignal(level);
    }
}


/* ================= VIBRATION ================= */

let vibrationInterval = null;

function vibrateWatch(level) {

    stopVibration();

    if (!("vibrate" in navigator)) {
        return;
    }

    const pattern =
        level > 0
            ? [120, 80, 120]
            : [300, 100, 300];

    navigator.vibrate(pattern);

    vibrationInterval = setInterval(() => {

        try {
            navigator.vibrate(pattern);
        } catch (e) {}

    }, level > 0 ? 700 : 900);
}

function stopVibration() {

    if (vibrationInterval) {
        clearInterval(vibrationInterval);
        vibrationInterval = null;
    }

    try {
        if ("vibrate" in navigator) {
            navigator.vibrate(0);
        }
    } catch (e) {}
}


/* ================= SIGNAL ================= */

function showSignal(level) {

    const signal =
        document.getElementById("signal");

    const value =
        document.getElementById("signalValue");

    const text =
        document.getElementById("signalText");


    // ВАЖНО:
    // Теперь показываем USDT, а не %

    value.textContent =
        (level > 0 ? "+" : "") +
        level +
        " USDT";


    if (level > 0) {

        value.className =
            "signal-value green";

        text.textContent =
            "PROFIT";

    } else {

        value.className =
            "signal-value red";

        text.textContent =
            "LOSS";
    }


    signal.style.display = "flex";


    // Вибрация
    vibrateWatch(level);

    // Звук до закрытия уведомления
    startBeep(level);
}


/* ================= CLOSE ================= */

function closeSignal() {

    document.getElementById("signal")
        .style.display = "none";

    // Остановить звук
    stopBeep();

    // Остановить вибрацию
    stopVibration();
}


/* ================= SOUND ================= */

let beepContext = null;
let beepOscillator = null;
let beepGain = null;
let beepInterval = null;

function startBeep(level) {

    stopBeep();

    try {

        const AudioContext =
            window.AudioContext ||
            window.webkitAudioContext;

        if (!AudioContext) {
            return;
        }

        beepContext = new AudioContext();

        const frequency =
            level > 0 ? 880 : 440;

        function beep() {

            if (!beepContext) {
                return;
            }

            const oscillator =
                beepContext.createOscillator();

            const gain =
                beepContext.createGain();

            oscillator.connect(gain);
            gain.connect(beepContext.destination);

            oscillator.type = "sine";

            oscillator.frequency.value =
                frequency;

            const now =
                beepContext.currentTime;

            gain.gain.setValueAtTime(
                0.001,
                now
            );

            gain.gain.exponentialRampToValueAtTime(
                0.20,
                now + 0.02
            );

            gain.gain.exponentialRampToValueAtTime(
                0.001,
                now + 0.25
            );

            oscillator.start(now);

            oscillator.stop(now + 0.27);
        }

        // Первый бип сразу
        beep();

        // Повторять
        beepInterval =
            setInterval(
                beep,
                level > 0 ? 500 : 700
            );

    } catch (e) {}

}


function stopBeep() {

    if (beepInterval) {
        clearInterval(beepInterval);
        beepInterval = null;
    }

    try {

        if (beepOscillator) {
            beepOscillator.stop();
        }

    } catch (e) {}

    beepOscillator = null;

    if (beepContext) {

        try {
            beepContext.close();
        } catch (e) {}

        beepContext = null;
    }
}


/* ================= RESET ================= */

function resetTerminal() {

    if (ws) {

        try {
            ws.close();
        } catch (e) {}

    }

    ws = null;

    pair = "";
    margin = 0;
    leverage = 0;
    entryPrice = 0;
    direction = "";

    lastSignalLevel = null;


    document.getElementById("terminal")
        .style.display = "none";

    document.getElementById("setup")
        .style.display = "flex";


    document.getElementById("pairInput")
        .value = "";

    document.getElementById("marginInput")
        .value = "";

    document.getElementById("leverageInput")
        .value = "";

    document.getElementById("entryInput")
        .value = "";


    showStep(1);

    focusInput("pairInput");
}


/* ================= ENTER ================= */

document
    .getElementById("pairInput")
    .addEventListener(
        "keydown",
        e => {
            if (e.key === "Enter") {
                nextPair();
            }
        }
    );

document
    .getElementById("marginInput")
    .addEventListener(
        "keydown",
        e => {
            if (e.key === "Enter") {
                nextMargin();
            }
        }
    );

document
    .getElementById("leverageInput")
    .addEventListener(
        "keydown",
        e => {
            if (e.key === "Enter") {
                nextLeverage();
            }
        }
    );

document
    .getElementById("entryInput")
    .addEventListener(
        "keydown",
        e => {
            if (e.key === "Enter") {
                nextEntry();
            }
        }
    );


/* ================= START ================= */

window.addEventListener(
    "load",
    () => {
        focusInput("pairInput");
    }
);

</script>

</body>
</html>
