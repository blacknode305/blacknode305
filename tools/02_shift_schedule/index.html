<!DOCTYPE html>
<html lang="ru" data-theme="dark">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>blacknode305 • Календарь смен</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    <link rel="icon" type="image/jpeg" href="favicon.png">
    <!-- <link rel="stylesheet" href="./style.css"> -->
    <link rel="stylesheet" href="https://blacknode305.github.io/blacknode305/tools/02_shift_schedule/style.css">
  </head>
  <body>
    <canvas id="particles"></canvas>
    <div class="container">
      <div class="header">
        <a class="logo" href="https://blacknode305.github.io/blacknode305/">blacknode305</a>
        <button class="theme-toggle" id="themeToggle" aria-label="Toggle Theme">☀️</button>
      </div>
      <div class="hero">
        <h1>Календарь смен</h1>
        <p>• Сохраняй свои смены работы. <br>• Просматривай свои выходы на одну или на другую работу. <br>• Просматривай статистику по месяцам и годам. <br>• Выбирай месяц и смотри количество смен. <br>(Не завершен!)</p>
      </div>


      <div class="card">

      <div class="controls">

      <select id="month" class="select">

      <option value="0">Январь</option>
      <option value="1">Февраль</option>
      <option value="2">Март</option>
      <option value="3">Апрель</option>
      <option value="4">Май</option>
      <option value="5">Июнь</option>
      <option value="6">Июль</option>
      <option value="7">Август</option>
      <option value="8">Сентябрь</option>
      <option value="9">Октябрь</option>
      <option value="10">Ноябрь</option>
      <option value="11">Декабрь</option>

      </select>

      <input
        type="number"
        id="year"
        class="select"
        value="2026"
      />

      <button
        class="btn"
        onclick="generateCalendar()"
      >
      Открыть
      </button>

      </div>

      <div
        id="calendar"
        class="calendar"
      ></div>

      </div>
      <div class="card">

      <div class="controls">

      <input
        type="text"
        id="selectedDays"
        class="select"
        readonly
        placeholder="Выбранные дни"
      />

      <input
        type="text"
        id="shiftType"
        class="select"
        placeholder="Тип смены"
      />

      <input
        type="text"
        id="shiftColor"
        class="select"
        placeholder="#ff0000"
      />

      </div>

      <div class="controls">

      <button
        class="btn"
        onclick="assignShift()"
      >
      Сохранить смену
      </button>

      <button
        class="btn"
        onclick="exportData()"
      >
      Экспорт
      </button>

      <label class="btn">
      Импорт
      <input
        type="file"
        id="importFile"
        hidden
        onchange="importData(event)"
      >
      </label>

      </div>

      </div>
      <div class="card">

      <h2
        style="
          margin-bottom:16px;
          font-family:'Space Grotesk',sans-serif;
        "
      >
      Типы смен
      </h2>

      <div
        class="legend"
        id="legend"
      ></div>

      </div>


      <footer class="footer">© 2026 blacknode305 • Built with vanilla JS</footer>
    </div>
    <!-- <script src="./script.js"></script> -->
    <script src="https://blacknode305.github.io/blacknode305/tools/02_shift_schedule/script.js"></script>
  </body>
</html>
