<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>blacknode305 • Крипто контроллер</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    <!-- <link rel="icon" type="image/jpeg" href="favicon.png"> -->
    <!-- <link rel="stylesheet" href="./style.css"> -->
    <link rel="stylesheet" href="https://blacknode305.github.io/blacknode305/tools/04_crypto_controller/style.css">
</head>
<body>

<div class="container">

<header class="header">

<div class="logo">
  <a href="https://blacknode305.github.io/blacknode305/" class="logo">blacknode305</a>
</div>

<button
  class="theme-toggle"
  id="themeToggle"
>
☀️
</button>

</header>

<div class="hero">

<h1>
Крипто контроллер
</h1>

<!-- <p>
Курсы валют и конвертер
</p> -->

</div>

    <!-- Покупка -->
    <section>

        <h2>Покупка</h2>

        <input
            id="buyMarginInput"
            type="number"
            placeholder="Маржа ($)"
        >

        <input
            id="buyPriceInput"
            type="number"
            placeholder="Цена покупки"
        >

        <input
            id="buyPairInput"
            type="text"
            placeholder="Пара (например ETHUSDT)"
        >

        <button id="addBuyBtn">
            Добавить
        </button>

    </section>
    
    <hr>

<h2>Общий результат</h2>

<div id="portfolioSummary">
    <p>Всего вложено: <span id="totalMargin">$0.00</span></p>
    <p>Текущая стоимость: <span id="totalValue">$0.00</span></p>
    <p>Общая прибыль: <span id="totalProfit">$0.00</span></p>
    <p>Общий P/L: <span id="totalPercent">0.00%</span></p>
    <p>Всего монет: <span id="totalCoins">0.000000</span></p>
    <p>Сигнал: <span id="signal"></span></p>
</div>
    
    <hr>

    <h2>Мои покупки</h2>

    <table border="1" width="100%" id="buyTable">

        <thead>

            <tr>
                <th>Пара</th>
                <th>Маржа ($)</th>
                <th>Цена покупки</th>
                <th>Количество</th>
                <th>Цена сейчас</th>
                <th>Изменение цены</th>
                <th>P/L ($)</th>
                <th>P/L (%)</th>
                <th>Обновлено</th>
                <th>Удалить</th>
            </tr>

        </thead>

        <tbody id="buyTableBody">

        </tbody>

    </table>
</div>
    <script src="script.js"></script>

</body>
</html>
