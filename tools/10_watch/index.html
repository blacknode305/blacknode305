<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=450,height=450,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Crypto Watch Terminal</title>
<style>
* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #050505;
    color: #fff;
    font-family: Arial, sans-serif;
    overflow: hidden;
}

body {
    display: flex;
    justify-content: center;
    align-items: center;
}

#app {
    width: 450px;
    height: 450px;
    max-width: 100vw;
    max-height: 100vh;
    padding: 18px;
    position: relative;
    overflow: hidden;
}

/* ---------- SETUP ---------- */

#setup {
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    justify-content: center;
}

.logo {
    text-align: center;
    font-size: 22px;
    font-weight: 800;
    letter-spacing: 2px;
    margin-bottom: 25px;
}

.step {
    display: none;
}

.step.active {
    display: block;
}

.step-title {
    text-align: center;
    font-size: 15px;
    color: #888;
    margin-bottom: 12px;
}

input {
    width: 100%;
    height: 58px;
    border: 1px solid #333;
    border-radius: 16px;
    outline: none;
    background: #111;
    color: white;
    text-align: center;
    font-size: 24px;
    font-weight: 700;
}

input:focus {
    border-color: #777;
}

button {
    width: 100%;
    height: 52px;
    margin-top: 12px;
    border: 0;
    border-radius: 15px;
    background: #fff;
    color: #000;
    font-size: 17px;
    font-weight: 800;
}

button:active {
    transform: scale(.97);
}

.direction {
    display: flex;
    gap: 10px;
}

.direction button {
    flex: 1;
}

.long-btn {
    background: #19c37d;
    color: #000;
}

.short-btn {
    background: #ff4d4d;
    color: #000;
}

.progress {
    position: absolute;
    left: 18px;
    right: 18px;
    bottom: 15px;
    height: 4px;
    background: #222;
    border-radius: 5px;
}

.progress-bar {
    height: 100%;
    width: 20%;
    background: #fff;
    border-radius: 5px;
    transition: width .2s;
}

/* ---------- TERMINAL ---------- */

#terminal {
    display: none;
    width: 100%;
    height: 100%;
}

.header {
    height: 45px;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.pair {
    font-size: 18px;
    font-weight: 900;
}

.status {
    font-size: 11px;
    color: #777;
}

.price-box {
    text-align: center;
    margin-top: 12px;
}

.current-price {
    font-size: 38px;
    line-height: 1;
    font-weight: 900;
    letter-spacing: -1px;
}

.price-label {
    margin-top: 7px;
    font-size: 11px;
    color: #777;
}

.pnl-box {
    margin-top: 20px;
    padding: 16px 10px;
    border-radius: 22px;
    background: #101010;
    text-align: center;
}

.pnl {
    font-size: 45px;
    line-height: 1;
    font-weight: 900;
}

.pnl-percent {
    margin-top: 7px;
    font-size: 18px;
    font-weight: 700;
}

.green {
    color: #19c37d;
}

.red {
    color: #ff4d4d;
}

.neutral {
    color: #fff;
}

.info {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 7px;
    margin-top: 13px;
}

.info-item {
    background: #101010;
    border-radius: 12px;
    padding: 8px;
    text-align: center;
}

.info-label {
    font-size: 9px;
    color: #666;
    margin-bottom: 3px;
}

.info-value {
    font-size: 14px;
    font-weight: 800;
}

.footer {
    position: absolute;
    left: 18px;
    right: 18px;
    bottom: 12px;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.direction-label {
    font-size: 12px;
    font-weight: 900;
}

.reset {
    width: auto;
    height: 30px;
    padding: 0 12px;
    margin: 0;
    border-radius: 10px;
    background: #222;
    color: #aaa;
    font-size: 11px;
}

/* ---------- SIGNAL ---------- */

#signal {
    position: absolute;
    inset: 0;
    display: none;
    align-items: center;
    justify-content: center;
    background: rgba(0,0,0,.93);
    z-index: 20;
}

.signal-inner {
    text-align: center;
}

.signal-title {
    font-size: 14px;
    color: #888;
    margin-bottom: 10px;
}

.signal-value {
    font-size: 65px;
    font-weight: 900;
}

.signal-text {
    margin-top: 8px;
    font-size: 14px;
    font-weight: 700;
}

.signal-close {
    width: 150px;
    height: 45px;
    margin-top: 20px;
    font-size: 14px;
}

/* ---------- SMALL SCREEN ---------- */

@media (max-width: 380px) {

    #app {
        padding: 14px;
    }

    .current-price {
        font-size: 31px;
    }

    .pnl {
        font-size: 38px;
    }

    .info-value {
        font-size: 12px;
    }
}
</style>
</head>

<body>

<div id="app">

    <!-- ================= SETUP ================= -->

    <div id="setup">

        <div class="logo">
            CRYPTO TERMINAL
        </div>

        <!-- STEP 1 -->
        <div class="step active" id="step1">

            <div class="step-title">
                1 / 5 — Торговая пара
            </div>

            <input
                id="pairInput"
                type="text"
                placeholder="BTCUSDT"
                autocomplete="off"
                autocapitalize="characters"
                spellcheck="false">

            <button onclick="nextPair()">
                ВВОД
            </button>

        </div>

        <!-- STEP 2 -->
        <div class="step" id="step2">

            <div class="step-title">
                2 / 5 — Маржа USDT
            </div>

            <input
                id="marginInput"
                type="number"
                inputmode="decimal"
                placeholder="100">

            <button onclick="nextMargin()">
                ВВОД
            </button>

        </div>

        <!-- STEP 3 -->
        <div class="step" id="step3">

            <div class="step-title">
                3 / 5 — Плечо
            </div>

            <input
                id="leverageInput"
                type="number"
                inputmode="decimal"
                placeholder="10">

            <button onclick="nextLeverage()">
                ВВОД
            </button>

        </div>

        <!-- STEP 4 -->
        <div class="step" id="step4">

            <div class="step-title">
                4 / 5 — Цена входа
            </div>

            <input
                id="entryInput"
                type="number"
                inputmode="decimal"
                placeholder="100000">

            <button onclick="nextEntry()">
                ВВОД
            </button>

        </div>

        <!-- STEP 5 -->
        <div class="step" id="step5">

            <div class="step-title">
                5 / 5 — Направление
            </div>

            <div class="direction">

                <button
                    class="long-btn"
                    onclick="startTerminal('LONG')">
                    LONG
                </button>

                <button
                    class="short-btn"
                    onclick="startTerminal('SHORT')">
                    SHORT
                </button>

            </div>

        </div>

        <div class="progress">
            <div class="progress-bar" id="progressBar"></div>
        </div>

    </div>


    <!-- ================= TERMINAL ================= -->

    <div id="terminal">

        <div class="header">

            <div class="pair" id="pairDisplay">
                BTC-USDT-SWAP
            </div>

            <div class="status" id="status">
                CONNECTING
            </div>

        </div>

        <div class="price-box">

            <div
                class="current-price"
                id="currentPrice">
                ---
            </div>

            <div class="price-label">
                CURRENT PRICE
            </div>

        </div>

        <div class="pnl-box">

            <div
                class="pnl neutral"
                id="pnl">
                0.00
            </div>

            <div
                class="pnl-percent neutral"
                id="pnlPercent">
                0.00%
            </div>

        </div>

        <div class="info">

            <div class="info-item">
                <div class="info-label">
                    MARGIN
                </div>

                <div
                    class="info-value"
                    id="marginDisplay">
                    ---
                </div>
            </div>

            <div class="info-item">
                <div class="info-label">
                    LEVERAGE
                </div>

                <div
                    class="info-value"
                    id="leverageDisplay">
                    ---
                </div>
            </div>

            <div class="info-item">
                <div class="info-label">
                    ENTRY
                </div>

                <div
                    class="info-value"
                    id="entryDisplay">
                    ---
                </div>
            </div>

            <div class="info-item">
                <div class="info-label">
                    POSITION
                </div>

                <div
                    class="info-value"
                    id="positionDisplay">
                    ---
                </div>
            </div>

        </div>

        <div class="footer">

            <div
                class="direction-label"
                id="directionDisplay">
                LONG
            </div>

            <button
                class="reset"
                onclick="resetTerminal()">
                RESET
            </button>

        </div>

    </div>


    <!-- ================= SIGNAL ================= -->

    <div id="signal">

        <div class="signal-inner">

            <div class="signal-title">
                PNL SIGNAL
            </div>

            <div
                class="signal-value"
                id="signalValue">
                +5%
            </div>

            <div
                class="signal-text"
                id="signalText">
                PROFIT LEVEL
            </div>

            <button
                class="signal-close"
                onclick="closeSignal()">
                OK
            </button>

        </div>

    </div>

</div>


<script>

/*
==========================================================
CRYPTO WATCH TERMINAL
OKX PUBLIC API
==========================================================
*/

let pair = "";
let margin = 0;
let leverage = 0;
let entryPrice = 0;
let direction = "";

let ws = null;

let lastSignalLevel = null;


/* ======================================================
   HELPERS
====================================================== */

function showStep(number) {

    document.querySelectorAll(".step")
        .forEach(el => el.classList.remove("active"));

    document
        .getElementById("step" + number)
        .classList.add("active");

    document
        .getElementById("progressBar")
        .style.width = ((number / 5) * 100) + "%";
}


function normalizePair(value) {

    value = value
        .toUpperCase()
        .replace(/[^A-Z0-9]/g, "");

    if (value.endsWith("USDT")) {
        return value.replace("USDT", "") + "-USDT-SWAP";
    }

    if (value.endsWith("USD")) {
        return value.replace("USD", "") + "-USDT-SWAP";
    }

    return value + "-USDT-SWAP";
}


function formatPrice(price) {

    if (!Number.isFinite(price)) {
        return "---";
    }

    if (price >= 1000) {
        return price.toLocaleString("en-US", {
            minimumFractionDigits: 2,
            maximumFractionDigits: 2
        });
    }

    if (price >= 1) {
        return price.toFixed(3);
    }

    return price.toFixed(6);
}


function formatNumber(number) {

    return number.toLocaleString("en-US", {
        minimumFractionDigits: 2,
        maximumFractionDigits: 2
    });
}


/* ======================================================
   SETUP
====================================================== */

function nextPair() {

    const value =
        document.getElementById("pairInput")
        .value
        .trim();

    if (!value) {
        return;
    }

    pair = normalizePair(value);

    document.getElementById("pairInput").value =
        pair.replace("-USDT-SWAP", "USDT");

    showStep(2);

    focusInput("marginInput");
}


function nextMargin() {

    const value =
        parseFloat(
            document.getElementById("marginInput").value
        );

    if (!Number.isFinite(value) || value <= 0) {
        alert("Введите корректную маржу");
        return;
    }

    margin = value;

    showStep(3);

    focusInput("leverageInput");
}


function nextLeverage() {

    const value =
        parseFloat(
            document.getElementById("leverageInput").value
        );

    if (!Number.isFinite(value) || value <= 0) {
        alert("Введите корректное плечо");
        return;
    }

    leverage = value;

    showStep(4);

    focusInput("entryInput");
}


function nextEntry() {

    const value =
        parseFloat(
            document.getElementById("entryInput").value
        );

    if (!Number.isFinite(value) || value <= 0) {
        alert("Введите корректную цену");
        return;
    }

    entryPrice = value;

    showStep(5);
}


function focusInput(id) {

    setTimeout(() => {

        const input =
            document.getElementById(id);

        if (input) {
            input.focus();
        }

    }, 100);
}


/* ======================================================
   START TERMINAL
====================================================== */

function startTerminal(side) {

    direction = side;

    document.getElementById("setup").style.display =
        "none";

    document.getElementById("terminal").style.display =
        "block";

    document.getElementById("pairDisplay").textContent =
        pair;

    document.getElementById("marginDisplay").textContent =
        "$" + formatNumber(margin);

    document.getElementById("leverageDisplay").textContent =
        leverage + "x";

    document.getElementById("entryDisplay").textContent =
        formatPrice(entryPrice);

    document.getElementById("positionDisplay").textContent =
        "$" + formatNumber(margin * leverage);

    document.getElementById("directionDisplay").textContent =
        direction;

    document.getElementById("directionDisplay").className =
        "direction-label " +
        (direction === "LONG" ? "green" : "red");

    connectOKX();
}


/* ======================================================
   OKX WEBSOCKET
====================================================== */

function connectOKX() {

    if (ws) {

        try {
            ws.close();
        } catch (e) {}

    }

    document.getElementById("status").textContent =
        "CONNECTING";

    ws = new WebSocket(
        "wss://ws.okx.com:8443/ws/v5/public"
    );


    ws.onopen = function() {

        document.getElementById("status").textContent =
            "LIVE";

        ws.send(
            JSON.stringify({
                op: "subscribe",
                args: [
                    {
                        channel: "tickers",
                        instId: pair
                    }
                ]
            })
        );

    };


    ws.onmessage = function(event) {

        try {

            const message =
                JSON.parse(event.data);

            if (
                message.arg &&
                message.arg.channel === "tickers" &&
                message.data &&
                message.data[0]
            ) {

                const price =
                    parseFloat(message.data[0].last);

                updatePrice(price);
            }

        } catch (error) {

            console.log(error);

        }

    };


    ws.onerror = function() {

        document.getElementById("status").textContent =
            "ERROR";

    };


    ws.onclose = function() {

        document.getElementById("status").textContent =
            "RECONNECT";

        setTimeout(() => {

            if (
                document.getElementById("terminal")
                .style.display !== "none"
            ) {
                connectOKX();
            }

        }, 3000);

    };

}


/* ======================================================
   PNL CALCULATION
====================================================== */

function updatePrice(currentPrice) {

    document.getElementById("currentPrice")
        .textContent =
        formatPrice(currentPrice);


    /*
       Position value
    */

    const positionSize =
        margin * leverage;


    /*
       Price movement
    */

    let priceChange;

    if (direction === "LONG") {

        priceChange =
            (currentPrice - entryPrice)
            / entryPrice;

    } else {

        priceChange =
            (entryPrice - currentPrice)
            / entryPrice;

    }


    /*
       PNL
    */

    const pnl =
        positionSize * priceChange;


    /*
       PNL percentage relative
       to margin
    */

    const pnlPercent =
        (pnl / margin) * 100;


    renderPNL(pnl, pnlPercent);

    checkSignal(pnlPercent);
}


/* ======================================================
   RENDER PNL
====================================================== */

function renderPNL(pnl, percent) {

    const pnlElement =
        document.getElementById("pnl");

    const percentElement =
        document.getElementById("pnlPercent");


    const pnlSign =
        pnl > 0 ? "+" : "";

    const percentSign =
        percent > 0 ? "+" : "";


    pnlElement.textContent =
        pnlSign +
        formatNumber(pnl) +
        " USDT";


    percentElement.textContent =
        percentSign +
        percent.toFixed(2) +
        "%";


    pnlElement.classList.remove(
        "green",
        "red",
        "neutral"
    );

    percentElement.classList.remove(
        "green",
        "red",
        "neutral"
    );


    if (pnl > 0) {

        pnlElement.classList.add("green");
        percentElement.classList.add("green");

    } else if (pnl < 0) {

        pnlElement.classList.add("red");
        percentElement.classList.add("red");

    } else {

        pnlElement.classList.add("neutral");
        percentElement.classList.add("neutral");

    }

}


/* ======================================================
   SIGNAL SYSTEM
====================================================== */

/*
   Signals:

   +5
   +10
   +15
   +20
   ...

   -5
   -10
   -15
   -20
   ...

   Every 5%.
*/


function getSignalLevel(percent) {

    if (percent === 0) {
        return 0;
    }

    const level =
        Math.floor(
            Math.abs(percent) / 5
        ) * 5;

    if (level < 5) {
        return null;
    }

    return percent > 0
        ? level
        : -level;
}


function checkSignal(percent) {

    const level =
        getSignalLevel(percent);


    if (level === null) {
        return;
    }


    /*
       Trigger only when crossing
       a new 5% level.
    */

    if (level !== lastSignalLevel) {

        lastSignalLevel = level;

        showSignal(level);

    }

}


/* ======================================================
   SIGNAL DISPLAY
====================================================== */

function showSignal(level) {

    const signal =
        document.getElementById("signal");

    const value =
        document.getElementById("signalValue");

    const text =
        document.getElementById("signalText");


    value.textContent =
        (level > 0 ? "+" : "") +
        level +
        "%";


    if (level > 0) {

        value.className =
            "signal-value green";

        text.textContent =
            "PROFIT LEVEL";

    } else {

        value.className =
            "signal-value red";

        text.textContent =
            "LOSS LEVEL";

    }


    signal.style.display =
        "flex";


    playBeep(level);
}


/* ======================================================
   CLOSE SIGNAL
====================================================== */

function closeSignal() {

    document.getElementById("signal")
        .style.display =
        "none";

}


/* ======================================================
   SOUND
====================================================== */

function playBeep(level) {

    try {

        const AudioContext =
            window.AudioContext ||
            window.webkitAudioContext;

        if (!AudioContext) {
            return;
        }

        const ctx =
            new AudioContext();

        const oscillator =
            ctx.createOscillator();

        const gain =
            ctx.createGain();


        oscillator.connect(gain);
        gain.connect(ctx.destination);


        oscillator.frequency.value =
            level > 0 ? 880 : 440;

        oscillator.type =
            "sine";


        gain.gain.setValueAtTime(
            0.001,
            ctx.currentTime
        );

        gain.gain.exponentialRampToValueAtTime(
            0.25,
            ctx.currentTime + 0.02
        );

        gain.gain.exponentialRampToValueAtTime(
            0.001,
            ctx.currentTime + 0.35
        );


        oscillator.start();

        oscillator.stop(
            ctx.currentTime + 0.4
        );


    } catch (e) {

        console.log(
            "Audio unavailable"
        );

    }

}


/* ======================================================
   RESET
====================================================== */

function resetTerminal() {

    if (ws) {

        try {
            ws.close();
        } catch (e) {}

    }

    ws = null;

    pair = "";
    margin = 0;
    leverage = 0;
    entryPrice = 0;
    direction = "";

    lastSignalLevel = null;


    document.getElementById("terminal")
        .style.display =
        "none";

    document.getElementById("setup")
        .style.display =
        "flex";


    document.getElementById("pairInput").value =
        "";

    document.getElementById("marginInput").value =
        "";

    document.getElementById("leverageInput").value =
        "";

    document.getElementById("entryInput").value =
        "";


    showStep(1);

    focusInput("pairInput");
}


/* ======================================================
   ENTER KEY SUPPORT
====================================================== */

document
    .getElementById("pairInput")
    .addEventListener(
        "keydown",
        function(e) {

            if (e.key === "Enter") {
                nextPair();
            }

        }
    );


document
    .getElementById("marginInput")
    .addEventListener(
        "keydown",
        function(e) {

            if (e.key === "Enter") {
                nextMargin();
            }

        }
    );


document
    .getElementById("leverageInput")
    .addEventListener(
        "keydown",
        function(e) {

            if (e.key === "Enter") {
                nextLeverage();
            }

        }
    );


document
    .getElementById("entryInput")
    .addEventListener(
        "keydown",
        function(e) {

            if (e.key === "Enter") {
                nextEntry();
            }

        }
    );


/* ======================================================
   INITIAL FOCUS
====================================================== */

window.addEventListener(
    "load",
    function() {
        focusInput("pairInput");
    }
);

</script>

</body>
</html>
