<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>blacknode305 • Fiat Rates</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./style.css">
    <!-- <link rel="stylesheet" href="https://blacknode305.github.io/blacknode305/tools/03_fiat_converter/style.css"> -->
</head>
<body>

<div class="container">

<header class="header">

<div class="logo">
  <a href="https://blacknode305.github.io/blacknode305/" class="logo">blacknode305</a>
</div>

<button
  class="theme-toggle"
  id="themeToggle"
>
☀️
</button>

</header>

<section class="hero">

<h1>
Fiat Currency Rates
</h1>

<p>
Курсы валют и конвертер
</p>

</section>

<div
  class="card"
  style="margin-top:22px;"
>

<h2 class="section-title">
Currency Converter
</h2>

<div class="controls">

<input
  type="number"
  id="amountInput"
  class="select"
  placeholder="Сумма"
  value="100"
/>

<select
  id="fromCurrency"
  class="select"
></select>

<select
  id="toCurrency"
  class="select"
></select>

<button
  class="btn"
  id="convertBtn"
>
Конвертировать
</button>

</div>

<div
  id="convertResult"
  class="info"
  style="font-size:18px;"
></div>

</div>

<div
  class="card"
  style="margin-top:22px;"
>

<h2 class="section-title">
Saved Pairs
</h2>

<div class="controls">

<select
  id="pairFrom"
  class="select"
></select>

<select
  id="pairTo"
  class="select"
></select>

<button
  class="btn"
  id="savePairBtn"
>
Сохранить пару
</button>

</div>

<div
  class="rates-grid"
  id="savedPairs"
></div>

</div>

<main class="card">

<div class="controls">

<select
  id="baseCurrency"
  class="select"
></select>

<button
  class="btn"
  id="loadBtn"
>
Обновить
</button>

</div>

<div
  class="info"
  id="info"
>
Загрузка...
</div>

<div
  class="rates-grid"
  id="ratesGrid"
></div>

</main>

<footer class="footer">
© 2026 blacknode305 • MoneyConvert API
</footer>

</div>
<script src="./script.js"></script>
<!-- <script src="https://blacknode305.github.io/blacknode305/tools/03_fiat_converter/script.js"></script> -->
</body>
</html>
